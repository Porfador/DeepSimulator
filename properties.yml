read_options:
  #Time format for both LoanApp_simplified_train.csv and Production.xes
  #timeformat: "%Y-%m-%dT%H:%M:%S.%f"
  #Time Format for BPIChallenge2019_3WayMatchingEC.xes and similar ones
  timeformat: "%Y-%m-%d %H:%M:%S%z"
  column_names:
  # For LoanApp_simplified_train.csv
  #  'case_id': caseid
  #  'activity': task
  #  'role': user
  #  'start_time': start_timestamp
  #  'end_time': end_timestamp
  # For Production.xes and maybe RequestForPayment
  #  'Case ID': caseid
  #  'Activity': task
  #  'lifecycle:transition': event_type
  #  'Resource': user
  # For BPIChallenge2019_3WayMatchingEC_prepared_copy.csv
    'case:concept:name': caseid
    'concept:name': task
    'User': user
    'start:timestamp': start_timestamp
    'end:timestamp': end_timestamp
  one_timestamp: false
  filter_d_attrib: true
paths:
  event_logs_path: input_files\event_logs
  bpmn_models: input_files\bpmn_models
  embedded_path: input_files\embedded_matrix
  ia_gen_path: input_files\ia_gen_models
  seq_flow_gen_path: input_files\seq_flow_gen_models
  times_gen_path: input_files\times_gen_models
  sm1_path: external_tools\splitminer\splitminer.jar
  sm2_path: external_tools\splitminer2\sm2.jar
  sm3_path: external_tools\splitminer3\bpmtk.jar
  bimp_path: external_tools\bimp\qbp-simulator-engine.jar
  align_path: external_tools\proconformance\ProConformance2.jar
  calender_path: external_tools\calenderimp\CalenderImp.jar
simulator: bimp


